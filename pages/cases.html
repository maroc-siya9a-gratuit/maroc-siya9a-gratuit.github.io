<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حالات من الطريق | امتحان رخصة السياقة بالمغرب</title><meta name="description" content="72 حالة من الطريق بالصورة والشرح — تعليم السياقة بالمغرب مجاناً."><meta property="og:title" content="حالات من الطريق | امتحان رخصة السياقة بالمغرب"><meta property="og:description" content="72 حالة من الطريق بالصورة والشرح — تعليم السياقة بالمغرب مجاناً."><meta property="og:type" content="website"><meta property="og:locale" content="ar_MA"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)"><script>document.documentElement.className='js'</script><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='10' fill='%2316181b'/><path d='M11 31 15 5M25 31 21 5' stroke='%23f4f0e8' stroke-width='2'/><path d='M18 7v4M18 16v4M18 25v5' stroke='%23f2b705' stroke-width='2.6' stroke-linecap='round'/></svg>"><link rel="stylesheet" href="../style.css"><script src="../site.js" defer></script></head><body><header class="top"><div class="wrap bar"><a class="brand" href="../index.html"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="var(--ink)"/><path d="M11 31 15 5M25 31 21 5" stroke="var(--bg)" stroke-width="2"/><path d="M18 7v4M18 16v4M18 25v5" stroke="#f2b705" stroke-width="2.6" stroke-linecap="round"/></svg><span><b>رخصة السياقة</b><small>امتحان المغرب · مجاني</small></span></a><nav class="nav" aria-label="الأقسام"><a href="../index.html#quiz">السلسلات</a><a href="../index.html#signs">الإشارات</a><a href="../index.html#lessons">الدروس</a><a href="../index.html#tips">النصائح</a><a href="../pages/cases.html" aria-current=page>الحالات</a><a href="../pages/qna.html">سؤال وجواب</a></nav><a class="sbtn" href="../index.html#search" aria-label="بحث"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a></div></header><main class="wrap"><nav class="crumbs" aria-label="المسار"><a href="../index.html">الرئيسية</a><span>حالات من الطريق&rlm;</span></nav><div class="ph"><h1>حالات من الطريق</h1><p class="lead">72 موقف من الطريق، كل واحد بالصورة وشنو خاصك دير.</p></div><div class="grid figs"><figure class="fig" id="c1"><img loading="lazy" decoding="async" src="../media/cases/01.webp" alt="الحالة 1"><figcaption><b>1</b><span>السيارة تخرج من الكراج، يجب التوقف حتى يخوى اليمين واليسار وبعد ذلك يمكن لها الخروج.</span></figcaption></figure><figure class="fig" id="c2"><img loading="lazy" decoding="async" src="../media/cases/02.webp" alt="الحالة 2"><figcaption><b>2</b><span>يوجد خط متقطع: مسموح بالتجاوز (السيارة الزرقاء مسموح لها بتجاوز السيارة الحمراء.)</span></figcaption></figure><figure class="fig" id="c3"><img loading="lazy" decoding="async" src="../media/cases/03.webp" alt="الحالة 3"><figcaption><b>3</b><span>يوجد خط متواصل: ممنوع على السيارة البيضاء تجاوز السيارة الخضراء.</span></figcaption></figure><figure class="fig" id="c4"><img loading="lazy" decoding="async" src="../media/cases/04.webp" alt="الحالة 4"><figcaption><b>4</b><span>خط متواصل من جهة اليمين: ممنوع على السيارة الزرقاء تجاوز السيارة الحمراء.</span></figcaption></figure><figure class="fig" id="c5"><img loading="lazy" decoding="async" src="../media/cases/05.webp" alt="الحالة 5"><figcaption><b>5</b><span>يوجد خط متقطع من الجهة اليمنى: مسموح للسيارة الصفراء تجاوز السيارة الزرقاء.</span></figcaption></figure><figure class="fig" id="c6"><img loading="lazy" decoding="async" src="../media/cases/06.webp" alt="الحالة 6"><figcaption><b>6</b><span>ممنوع على السيارة الحمراء تجاوز سيارتين في نفس اللحظة.</span></figcaption></figure><figure class="fig" id="c7"><img loading="lazy" decoding="async" src="../media/cases/07.webp" alt="الحالة 7"><figcaption><b>7</b><span>الطريق ذات إتجاهين إثنين، مسموح بالتجاوز.</span></figcaption></figure><figure class="fig" id="c8"><img loading="lazy" decoding="async" src="../media/cases/08.webp" alt="الحالة 8"><figcaption><b>8</b><span>.السيارة الحمراء متوقفة بشكل جيد، لانها خارجة عن لبيست</span></figcaption></figure><figure class="fig" id="c9"><img loading="lazy" decoding="async" src="../media/cases/09.webp" alt="الحالة 9"><figcaption><b>9</b><span>السيارة الصفراء غير متوقفة بشكل جيد، بجب عليها الوقوف خارج لبسيت (خارج الطريق) لانها تعرقل حركة السير.</span></figcaption></figure><figure class="fig" id="c10"><img loading="lazy" decoding="async" src="../media/cases/10.webp" alt="الحالة 10"><figcaption><b>10</b><span>العقبة: بما أن التّراجع سهل بالنسبة للسّيارة الصاعدة، فمن الأفضل لها أن تتراجع.</span></figcaption></figure><figure class="fig" id="c11"><img loading="lazy" decoding="async" src="../media/cases/11.webp" alt="الحالة 11"><figcaption><b>11</b><span>السيارتين منحازتين بشكل جيد، السيارة التي سوف تنعطف إلى اليمين فهي منحازة لليمين، وبالنسبة للسيارة التي تريد الإنعطاف إلى اليسار فهي منحازة لليسار.</span></figcaption></figure><figure class="fig" id="c12"><img loading="lazy" decoding="async" src="../media/cases/12.webp" alt="الحالة 12"><figcaption><b>12</b><span>السيارتين غير منحازتين بشكل جيد، عكس المثال السابق، السيارة التي تريد الإنعطاف لليمين يجب عليها الإنحياز لليمين وليس لليسار، وبالنسبة للسيارة التي تريد الإنعطاف إلى اليسار فيجب عليها الإنحياز لليسار وليس لليمين.</span></figcaption></figure><figure class="fig" id="c13"><img loading="lazy" decoding="async" src="../media/cases/13.webp" alt="الحالة 13"><figcaption><b>13</b><span>ملتقى الطّرق والأسبقية هنا للسيارة القادمة من اليمين،السيارة الحمراء سوف تمر أولا وبعد ذلك السيارة الصفراء.</span></figcaption></figure><figure class="fig" id="c14"><img loading="lazy" decoding="async" src="../media/cases/14.webp" alt="الحالة 14"><figcaption><b>14</b><span>نتواجد في ملتقى الطّرق، الشاحنة سوف تقوم بالمرور أولا، لأن السيارة الزرقاء تريد الإنعطاف لليسار، في هذه الحالة سوف تتواجد الشاحنة على يمين السيارة الزرقاء، إذن تقوم الشاحنة بالمرور أولا.</span></figcaption></figure><figure class="fig" id="c15"><img loading="lazy" decoding="async" src="../media/cases/15.webp" alt="الحالة 15"><figcaption><b>15</b><span>إنتباه، توجد لافتة طرقية للسيارة الزرقاء تعني أنه لديها حق الأسبقية في ملتقى الطّرق، بعد ذلك سوف تمر الشاحنة لأن إتجاهها مباشرة، وبعد ذلك سوف تمر السيارة الحمراء لأنها سوف تنعطف لليسار.،</span></figcaption></figure><figure class="fig" id="c16"><img loading="lazy" decoding="async" src="../media/cases/16.webp" alt="الحالة 16"><figcaption><b>16</b><span>نتواجد في ملتقى طرق بدون لافتات طرقية وفي هذه الحالة الأسبقية للسيارات القادمة من اليمين، في هذه الحالة الشاحنة لا توجد لديها عربات قادمة من الجهة اليمنى إذن سوف تتقدم الشاحنة إلى منتصف الملتقى وتنتظر الشاحنة إلى حين ان تصبح الطريق على يمينها فارغ إذن سوف تمر السيارة الحمراء أولا لأنها تتواجد على يمين السيارة الصفراء، وبعد ذلك السيارة الصفراء وفي الأخير تقوم الشاحنة بالمرور.</span></figcaption></figure><figure class="fig" id="c17"><img loading="lazy" decoding="async" src="../media/cases/17.webp" alt="الحالة 17"><figcaption><b>17</b><span>نتواجد في ملتقى طرق، الأسبقية للعربات القادمة من اليمين، سوف تقوم الشاحنة أولا بالمرور لأنه لا توجد عربات قادمة من الجهة اليمنى الخاصة بها، بعد ذلك سوف تقوم السيارة الثفراء بالمرور وأخيرا سوف تقوم السيارة الحمراء بالمرور.</span></figcaption></figure><figure class="fig" id="c18"><img loading="lazy" decoding="async" src="../media/cases/18.webp" alt="الحالة 18"><figcaption><b>18</b><span>نتواجد في ملتقى الطرق، الأسبقية دائما للعربات القادمة من الجهة اليمنى، في هذه الحالة، سوف تمر السيارة الزرقاء على اليمين أولا، وبعد ذلك السيارة البرتقالية لأنها متّجهة مباشرة، وبعد ذلك السيّارة الخضراء وتقوم بالمرور أخيرا الشاحنة.</span></figcaption></figure><figure class="fig" id="c19"><img loading="lazy" decoding="async" src="../media/cases/19.webp" alt="الحالة 19"><figcaption><b>19</b><span>ملتقى طرق وتوجد علامة الإنتباه الطريق الصغيرة في الكبيرة مول لكبيرة يدوز أولا، سوف تقوم السيارتين الصفراء والحمراء بالمرور أولا لأنهم يتواجدان في الطريق الرئيسية، وبعد ذلك تقوم السيارة الزرقاء بالمرور.</span></figcaption></figure><figure class="fig" id="c20"><img loading="lazy" decoding="async" src="../media/cases/20.webp" alt="الحالة 20"><figcaption><b>20</b><span>نتواجد في ملتقى الطّرق والأسبقية للعربات القادمة من الجهة اليمنى، سوف تقوم سيارة الأجرة بالمرور أولا لأنها سوف تنعطف على اليمين، وبعد ذلك السيّارة البيضاء سوف تتجه إلى وسط الطريق وتنتظر أن حتى مرور السيّارة الخضراء لكي تمر الحافلة وتقوم السيارة البيضاء بالمرور أخيرا.</span></figcaption></figure><figure class="fig" id="c21"><img loading="lazy" decoding="async" src="../media/cases/21.webp" alt="الحالة 21"><figcaption><b>21</b><span>نتواجد في ملتقى طرق مع علامة طرقية قف، سوف تمر الشاحنة أولا، وبعد ذلك السيّارة الزرقاء لأن على يمينها فارغ بعد مرور الشاحنة، وبعد ذلك السيارة الصفراء وفي الأخير السيارة الخضراء لأن لديها إشارة المرور قف.</span></figcaption></figure><figure class="fig" id="c22"><img loading="lazy" decoding="async" src="../media/cases/22.webp" alt="الحالة 22"><figcaption><b>22</b><span>السيارة الصفراء والزرقاء لديهم الأسبقية للمرور أولا لأن لديهم اللافتة الطّرقية التي تشير إلى حق الأسبقية أولا، وبعد ذلك سوف تقوم السيارة والشاحنة بالمرور لأن ليس لديهم حق الأسبقية (لافتة الطريق الصغيرة).</span></figcaption></figure><figure class="fig" id="c23"><img loading="lazy" decoding="async" src="../media/cases/23.webp" alt="الحالة 23"><figcaption><b>23</b><span>ملتقى الطّرق الأسبقية للعربات القادمة من الجهة اليمنى، في هذه الحالة الأسبقية لسيارة الشرطة، بعد ذلك سوف تقوم السيارة الحمراء بالمرور لأنه لا توجد سيارات على يمينها، بعد ذلك تقوم السيارة الخضراء بالمرور وأخيرا سوف تقوم الشاحنة بالمرور.</span></figcaption></figure><figure class="fig" id="c24"><img loading="lazy" decoding="async" src="../media/cases/24.webp" alt="الحالة 24"><figcaption><b>24</b><span>في ملتقى الطرق وعندما توجد إشارات ضوئية فيجب إحترام الإشارة الضوئية، إذن سوف تقوم السيارة الزرقاء والشاحنة بالمرور أولا لأن لديهم الضوء أخضر، بعد ذلك سوف تقوم السيارة الحمراء والصفراء بالمرور عندما يشتغل الضوء الأخضر عندهم.</span></figcaption></figure><figure class="fig" id="c25"><img loading="lazy" decoding="async" src="../media/cases/25.webp" alt="الحالة 25"><figcaption><b>25</b><span>ملتقى الطرق مع علامة قف وإشارات ضوئية، في هذه الحالة إذا كانت الإشارة الضوئية غير شغالة فسوف نطبق علامة قف، لكن إذا كانت الإشارة الضوئية شغالة فعلامة قف تلغى.</span></figcaption></figure><figure class="fig" id="c26"><img loading="lazy" decoding="async" src="../media/cases/26.webp" alt="الحالة 26"><figcaption><b>26</b><span>في هذا ملتفى الطّرق يوجد إشارات ضوئية وكذلك علامة طرقية الطريق الصغيرة في الكبيرة، نفس المثال السابق، إذا كانت الإشارة الضوئية شغالة فسوف نلغي اللاّفتة الطّرقية، لكن إذا كانت الإشارة الضّوئية غير شغالة ففي هذه الحالة سوف نطبّق اللاّفتة الطّرقية الطريق الصغيرة في الكبيرة.</span></figcaption></figure><figure class="fig" id="c27"><img loading="lazy" decoding="async" src="../media/cases/27.webp" alt="الحالة 27"><figcaption><b>27</b><span>عند وجود شرطي في ملتقى الطرق فنلغي قاعدة الأسبقية لليمين وننتظر إشارة المرور من طرف شرطي المرور، في هذه الحالة السيارة الصفراء والشاحنة سوق يمرّان أولا لأن شرطي المرور سمح لهم بالمرور، وبعد ذلك السيارة الخضراء والحمراء تنتظر إشارة السّماح بالمرور من الشرطي لكي تقومان بالمرور بعد ذلك.</span></figcaption></figure><figure class="fig" id="c28"><img loading="lazy" decoding="async" src="../media/cases/28.webp" alt="الحالة 28"><figcaption><b>28</b><span>عند وجود شرطي المرور فتلغى جميع الإشارات الطّرقية، في هذه الحالة شرطي المرور يعطي أمر الوقوف للشاحنة والسيارة الصفراء بالرغم من أن لديهم الإشارة الضوئية خضراء، سوف تقوم السيارة الخضراء والسّيارة الزرقاء بالمرور أولا وبعد ذلك تنتظر السيارة الصفراء والشاحنة إشارة المرور من شرطي المرور.</span></figcaption></figure><figure class="fig" id="c29"><img loading="lazy" decoding="async" src="../media/cases/29.webp" alt="الحالة 29"><figcaption><b>29</b><span>السيارة الصفراء تقف لأن لديها العلامة الطّرقية قف، وكذلك السيارة الحمراء سوف تقف لأن لديها الإشارة الضوئية حمراء، لذلك سوف تقوم الشاحنة بالمرور أولا لأن الإشارة الضوئية لديها خضراء.</span></figcaption></figure><figure class="fig" id="c30"><img loading="lazy" decoding="async" src="../media/cases/30.webp" alt="الحالة 30"><figcaption><b>30</b><span>ملتقى الطرق يحتوي على إشارة ضوئية، الإشارة الضوئية تشير إلى أنه ممكن للسيارات المتوجّهة مباشرة المرور، لكن بالنسبة للسيارات التي تريد الإنعطاف يجب عليها الإنتظار إلى حين إشتغال الضوء الأخضر.</span></figcaption></figure><figure class="fig" id="c31"><img loading="lazy" decoding="async" src="../media/cases/31.webp" alt="الحالة 31"><figcaption><b>31</b><span>إتجاه مداري (رومبوان) مع إشارة تشير إلى الأسبقية للسيارات القادمة من اليمين، سوف تقوم السيارة الصفراء بالمرور أولا لأنه لا توجد عربات على يمينها، وبعد ذلك السيارة الخضراء وبعد ذلك السيارة الحمراء ثم البيضاء وفي الأخير السيّارة الزرقاء.</span></figcaption></figure><figure class="fig" id="c32"><img loading="lazy" decoding="async" src="../media/cases/32.webp" alt="الحالة 32"><figcaption><b>32</b><span>إتجاه مداري (رومبوان) مع علامة قف، سوف تقوم السيارة الصفراء والبيضاء بالمرور لأنه لا توجد لديهم علامة قف، وبعد ذلك السيارة الخضراء وفي الأخير السيارة الزرقاء والشاحنة لأن لديهم علامة قف.</span></figcaption></figure><figure class="fig" id="c33"><img loading="lazy" decoding="async" src="../media/cases/33.webp" alt="الحالة 33"><figcaption><b>33</b><span>إنتباه رومبوان مع علامة طرقية ليس لكم حق الأسبقية، الأسبقية في هذه الحالة للسيارة المتواجدة في الرومبوان أولا، إذن سوف تمر السيارة الزرقاء أولا وبعد ذلك السيارة البيضاء.</span></figcaption></figure><figure class="fig" id="c34"><img loading="lazy" decoding="async" src="../media/cases/34.webp" alt="الحالة 34"><figcaption><b>34</b><span>الأسبقية للرّاجلين لأنهم إندمجوا في ممر الرّاجلين يجب على السيارة الزرقاء إنتظار مرورهم وبعد ذلك تقوم بالمرور لأن لديها الإشارة الضوئية خضراء، ثم بعد ذلك السيارة الحمراء تقوم بالمرور عندما تصبح الإشارة الضوئية الخاصة بها خضراء.</span></figcaption></figure><figure class="fig" id="c35"><img loading="lazy" decoding="async" src="../media/cases/35.webp" alt="الحالة 35"><figcaption><b>35</b><span>السيارة الخضراء سوف تقوم بالإنعطاف لليسار، في هذه الحالة مسموح للسيارة الزرقاء بتجاوز السيارة الخضراء من الجهة اليمنى.</span></figcaption></figure><figure class="fig" id="c36"><img loading="lazy" decoding="async" src="../media/cases/36.webp" alt="الحالة 36"><figcaption><b>36</b><span>اللافتة الطّرقية تشير إلى طريق صغيرة في لكبيرة، في هذه الحالة يحب على السيارة الزرقاء الإنتباه والتخفيف من السرعة وإنتظار السيارة الخضراء أن تقوم بالمرور أولا وبعد ذلك، عندما تصبح الطريق فارغة يمكن للسيارة الزرقاء الإندماج في حركة السير.</span></figcaption></figure><figure class="fig" id="c37"><img loading="lazy" decoding="async" src="../media/cases/37.webp" alt="الحالة 37"><figcaption><b>37</b><span>السيارة خارجة من الكراج، يعني خاصها توقف حتى يخوى ليمن وليسر ديالها عاد تقدر تندمج فالطريق الرئيسي.</span></figcaption></figure><figure class="fig" id="c38"><img loading="lazy" decoding="async" src="../media/cases/38.webp" alt="الحالة 38"><figcaption><b>38</b><span>خط متقطع، يعني أنه مسموح للسيارة الزرقاء تجاوز السيارة الحمراء.</span></figcaption></figure><figure class="fig" id="c39"><img loading="lazy" decoding="async" src="../media/cases/39.webp" alt="الحالة 39"><figcaption><b>39</b><span>خط متصل كيمنع التجاوز، يعني السيارة البيضاء ممنوع عليها تجاوز السيارة الخضراء.</span></figcaption></figure><figure class="fig" id="c40"><img loading="lazy" decoding="async" src="../media/cases/40.webp" alt="الحالة 40"><figcaption><b>40</b><span>خط متصل من الجهة اليمنى و خط متقطع من الجهة اليسرى، بما ان السيارة الزرقاء كتتواجد فالجهة اليمنى فممنوع عليها تجاوز السيارة الحمراء.</span></figcaption></figure><figure class="fig" id="c41"><img loading="lazy" decoding="async" src="../media/cases/41.webp" alt="الحالة 41"><figcaption><b>41</b><span>خط متقطع من الجهة اليمنى و خط متصل من الجهة اليسرى، بما أن السيارة الصفراء كتتواجد فالجهة اليمنى فمسموح ليها تجاوز السيارة الزرقاء.</span></figcaption></figure><figure class="fig" id="c42"><img loading="lazy" decoding="async" src="../media/cases/42.webp" alt="الحالة 42"><figcaption><b>42</b><span>بصفة عامة ممنوع التجاوز ديال أكثر من عربة فوقت واحد، بإستثناء الطريق لي فاتجاه واحد، بحال الطريق السيار مثلا مسموح التجاوز ديال أكثر من عربة فوقت واحد.</span></figcaption></figure><figure class="fig" id="c43"><img loading="lazy" decoding="async" src="../media/cases/43.webp" alt="الحالة 43"><figcaption><b>43</b><span>الطريق ذو اتجاهين، والعربتين الحمراء و الزرقاء كيستعملو المسلك الثاني للتجاوز، ماكاين حتا مشكل.</span></figcaption></figure><figure class="fig" id="c44"><img loading="lazy" decoding="async" src="../media/cases/44.webp" alt="الحالة 44"><figcaption><b>44</b><span>السيارة الحمراء واقفة مزيان حيث خارجة من الطريق.</span></figcaption></figure><figure class="fig" id="c45"><img loading="lazy" decoding="async" src="../media/cases/45.webp" alt="الحالة 45"><figcaption><b>45</b><span>السيارة الصفراء ماواقفاش مزيان، خاصها تخرج من الطريق بشكل كامل باش ماتعرقلش حركة السير.</span></figcaption></figure><figure class="fig" id="c46"><img loading="lazy" decoding="async" src="../media/cases/46.webp" alt="الحالة 46"><figcaption><b>46</b><span>هنا كاينة عقبة، بما أن التراجع او الوقوف كيكون اسهل على العربة لي طالعة فمن الأفضل تعطي الطريق.</span></figcaption></figure><figure class="fig" id="c47"><img loading="lazy" decoding="async" src="../media/cases/47.webp" alt="الحالة 47"><figcaption><b>47</b><span>السيارات بجوج فالمسلك المناسب ديالهوم، اللي غادي تدور على اليمين شادة اليمين وللي غادي تدور على اليسار شادة اليسار.</span></figcaption></figure><figure class="fig" id="c48"><img loading="lazy" decoding="async" src="../media/cases/48.webp" alt="الحالة 48"><figcaption><b>48</b><span>السيارات فبجوج في المسلك الغير مناسب، خاص للي غادي يدور على اليمين يشد اليمين واللي غادي يدور على اليسار يشد اليسار.</span></figcaption></figure><figure class="fig" id="c49"><img loading="lazy" decoding="async" src="../media/cases/49.webp" alt="الحالة 49"><figcaption><b>49</b><span>هنا كاين ملتقى طرق، بما ان السيارة الحمراء كتتواجد على اليمين ديال السيارة الصفراء، خاصها تدوز هي اللولة.</span></figcaption></figure><figure class="fig" id="c50"><img loading="lazy" decoding="async" src="../media/cases/50.webp" alt="الحالة 50"><figcaption><b>50</b><span>هنا كاين ملتقى طرق، الى دارت السيارة الزرقاء هي اللولة غادي تولي الشاحنة على اليمين ديالها، و حنا عارفين فملتقى الطرق الأسبقية لليمين، يعني خاص الشاحنة تدوز هي اللولة.</span></figcaption></figure><figure class="fig" id="c51"><img loading="lazy" decoding="async" src="../media/cases/51.webp" alt="الحالة 51"><figcaption><b>51</b><span>هنا كاين علامة حق الأسبقية، يعني السيارة الزرقاء هي للي فالطريق الكبيرة و خاصها تدوز هي اللولة. كتبقى الشاحنة و السيارة الحمراء، بما انه ماعندهومش حتا علامة فكنطبقو قاعدة الأسبقية لليمين، بما أنه السيارة الحمراء الا دازت غادي تبقى الشاحنة على اليمين ديالها يعني خاص تدوز الشاحنة هي اللولة، عاد السيارة الحمراء.</span></figcaption></figure><figure class="fig" id="c52"><img loading="lazy" decoding="async" src="../media/cases/52.webp" alt="الحالة 52"><figcaption><b>52</b><span>هنا ملتقى الطرق مافيه حتا علامة، يعني كنطبقو قاعدة الأسبقية لليمين، الشاحنة خاوي اليمين ديالها يعني خاصو يتقدم حتا يعمر وسط الطريق ويوقف، هنا كيولي اليمين ديال السيارة الحمراء خاوي يعني كتدوز، و كتبعها السيارة الصفراء حيت غادي يخوا اليمين ديالها فاش غادي تدوز السيارة الحمراء، و أخيرا كتدوز الشاحنة.</span></figcaption></figure><figure class="fig" id="c53"><img loading="lazy" decoding="async" src="../media/cases/53.webp" alt="الحالة 53"><figcaption><b>53</b><span>هنا ملتقى الطرق مافيه حتا علامة، يعني كنطبقو قاعدة الأسبقية لليمين، تدوز الشاحنة بما ان اليمن ديالها خاوي، تبعو السيارة الصفراء ثم أخيرا السيارة الحمراء.</span></figcaption></figure><figure class="fig" id="c54"><img loading="lazy" decoding="async" src="../media/cases/54.webp" alt="الحالة 54"><figcaption><b>54</b><span>هنا ملتقى الطرق مافيه حتا علامة، يعني كنطبقو قاعدة الأسبقية لليمين، تدوز السيارة الزرقاء على اليمين، تبعها السيارة البرتقالية، ثم السيارة الخضراء، و أخيرا تدوز الشاحنة.</span></figcaption></figure><figure class="fig" id="c55"><img loading="lazy" decoding="async" src="../media/cases/55.webp" alt="الحالة 55"><figcaption><b>55</b><span>هنا كاين علامة إعطاء حق الأسبقية، تدوز السيارة الصفراء والحمراء اللي فالطريق الرئيسية عاد السيارة الزرقاء للي فالطريق الثانوية.</span></figcaption></figure><figure class="fig" id="c56"><img loading="lazy" decoding="async" src="../media/cases/56.webp" alt="الحالة 56"><figcaption><b>56</b><span>هنا ملتقى الطرق، يعني كنطبقو قاعدة الأسبقية لليمين، ولكن بم انه كاينة عربة ديال الشرطة فالأسبقية ليها، ثم السيارة البيضاء غادي يخوا اليمين دياله، فغادي تعمر وسط الطريق وتوقف، كيخوى ليمن ديال السيارة الخضراء كتدوز و كتبعها الحافلة، ثم اخيرا السيارة البيضاء كتكمل طريقها.</span></figcaption></figure><figure class="fig" id="c57"><img loading="lazy" decoding="async" src="../media/cases/57.webp" alt="الحالة 57"><figcaption><b>57</b><span>هنا كاين علامة قف عند السيارة الخضراء، تدوز الشاحنة لأن ليمن ديالو فيه علامة قف، تبعو السيارة الزرقاء لأن ليمن ديالها غادي يخوى، اتدوز السيارة الصفراء ثم أخيرا السيارة الخضراء.</span></figcaption></figure><figure class="fig" id="c58"><img loading="lazy" decoding="async" src="../media/cases/58.webp" alt="الحالة 58"><figcaption><b>58</b><span>هنا ملتقى الطرق فيه علامة حق الأسبقية عند السيارة الصفراء و علامة إعطاء حق الأسبقية عند لسيارة الخضراء، يعني السيارة الصفراء والزرقاء يدوزوا لأنهم في الطريق الكبيرة، عاد تدوز السيارة الخضراء والشاحنة.</span></figcaption></figure><figure class="fig" id="c59"><img loading="lazy" decoding="async" src="../media/cases/59.webp" alt="الحالة 59"><figcaption><b>59</b><span>هنا ملتقى الطرق فيه علامة الخطر فقط، كنطبقو قاعدة الأسبقية لليمين، ولكن بما أنه كاين عربة ديال الشرطة دوز هي اللولة، يخوى اليمين ديال السيارة الحمراء تدوز، وتبعها السيارة الخضراء، ثم أخيرا الشاحنة.</span></figcaption></figure><figure class="fig" id="c60"><img loading="lazy" decoding="async" src="../media/cases/60.webp" alt="الحالة 60"><figcaption><b>60</b><span>هنا ملتقى الطرق مع التشوير الضوئي، الشاحنة والسيارة الزرقاء يدوزوا عندهم الضوء أخضر، السيارة الصفراء والحمراء يوقفو عندهم الضوء أحمر.</span></figcaption></figure><figure class="fig" id="c61"><img loading="lazy" decoding="async" src="../media/cases/61.webp" alt="الحالة 61"><figcaption><b>61</b><span>هنا ملتقى الطرق مع التشوير الضوئي و علامة قف، الى كان الضوء مخدامش علامة قف كتحكم، كان الضوء خدام علامة قف كتلغى.</span></figcaption></figure><figure class="fig" id="c62"><img loading="lazy" decoding="async" src="../media/cases/62.webp" alt="الحالة 62"><figcaption><b>62</b><span>هنا ملتقى الطرق مع التشوير الضوئي و علامة إعطاء حق الأسبقية، اذا كان الضوء مخدامش العلامة كتحكم اذا كان الضوء خدام العلامة كتلغى.</span></figcaption></figure><figure class="fig" id="c63"><img loading="lazy" decoding="async" src="../media/cases/63.webp" alt="الحالة 63"><figcaption><b>63</b><span>هنا ملتقى الطرق مع وجود شرطي المرور، تدوز السيارة الصفراء والشاحنة بما ان عطاهم الشرطي اشارة المرور (عاطيهم بالجنب) والسيارة الخضراء والحمراء يتسناو اشارة الشرطي.</span></figcaption></figure><figure class="fig" id="c64"><img loading="lazy" decoding="async" src="../media/cases/64.webp" alt="الحالة 64"><figcaption><b>64</b><span>هنا ملتقى الطرق مع التشوير الضوئي و شرطي المرور، الشاحنة والسيارة الصفراء يوقفو واخا عندهم الضوء أخضر، لأن الأضواء كتلغى فحضور الشرطي، والسيارة الزرقاء والخضراء يدوزو لأن الشرطي عاطيهم بالجنب.</span></figcaption></figure><figure class="fig" id="c65"><img loading="lazy" decoding="async" src="../media/cases/65.webp" alt="الحالة 65"><figcaption><b>65</b><span>السيارة الصفراء عندها قف توقف يدوز الكاميو عندو الضوء أخضر والسيارة الحمراء توقف عندها الضوء أحمر.</span></figcaption></figure><figure class="fig" id="c66"><img loading="lazy" decoding="async" src="../media/cases/66.webp" alt="الحالة 66"><figcaption><b>66</b><span>هنا ملتقى الطرق مع التشوير الضوئي، السيارة الصفراء تتبع السهم للأمام لأن عندها الضوء أخضر كيشير انه لي غادي يتابعو السير للأمام مسموح يدوزو، السيارة الحمراء توقف عندها الضوء أحمر.</span></figcaption></figure><figure class="fig" id="c67"><img loading="lazy" decoding="async" src="../media/cases/67.webp" alt="الحالة 67"><figcaption><b>67</b><span>عنا عندنا مدار، تدوز السيارة الصفراء خاوي ليمن ديالها يخوى ليمن السيارة الخضراء تدوز ثم السيارة الحمراء ثم البيضاء عاد السيارة الزرقاء هي الأخيرة.</span></figcaption></figure><figure class="fig" id="c68"><img loading="lazy" decoding="async" src="../media/cases/68.webp" alt="الحالة 68"><figcaption><b>68</b><span>علامة  قف و مدار، السيارة البيضاء والصفراء يدوزوا لأن اليمين ديالهم فيه قف، اتبعهم السيارة الخضراء عاد السيارة الزرقاء ثم الشاحنة.</span></figcaption></figure><figure class="fig" id="c69"><img loading="lazy" decoding="async" src="../media/cases/69.webp" alt="الحالة 69"><figcaption><b>69</b><span>مدار مع علامة إعطاء حق الاسبقية، الاسبقة للي دخل للمدار الأول، تدوز السيارة الزرقاء عاد تدوز السيارة البيضاء.</span></figcaption></figure><figure class="fig" id="c70"><img loading="lazy" decoding="async" src="../media/cases/70.webp" alt="الحالة 70"><figcaption><b>70</b><span>الأسبقية للراجلين، يدوزو الناس للي في الطريق عاد تكمل السيارة الزرقاء واخا عندها الضوء أخضر، السيارة الحمراء توقف عندها الضوء أحمر.</span></figcaption></figure><figure class="fig" id="c71"><img loading="lazy" decoding="async" src="../media/cases/71.webp" alt="الحالة 71"><figcaption><b>71</b><span>مسموح التجاوز على اليمين للسيارة الزرقاء اذا كانت السيارة الخضراء كتعلن على تغيير الاتجاه الى الجهة اليسرى (أضواء تغيير الإتجاه).</span></figcaption></figure><figure class="fig" id="c72"><img loading="lazy" decoding="async" src="../media/cases/72.webp" alt="الحالة 72"><figcaption><b>72</b><span>إعطاء حق الأسبقية فى الدخلة ديال الطريق السيار، السيارة الزرقاء تنقص من السرعة وتشد ليمن ديالها وتعطي الأسبقية للسيارة الخضراء عاد تدوز.</span></figcaption></figure></div></main><footer><div class="wrap"><p>محتوى تعليمي مجاني، مجموع من مصادر عامة. ماشي موقع رسمي، وما عندو حتى علاقة بالإدارة.</p><p>لقيتي شي غلط؟ <a href="https://github.com/maroc-siya9a-gratuit/maroc-siya9a-gratuit.github.io/issues">بلّغ عليه هنا</a></p></div></footer></body></html>
